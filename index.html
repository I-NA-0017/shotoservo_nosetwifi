<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ショート動画</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: black;
      overflow: hidden;
    }

    .container {
      width: 100vw;
      height: 100vh;

      overflow-y: scroll;

      scroll-snap-type: y mandatory;

      scrollbar-width: none;
    }

    .container::-webkit-scrollbar {
      display: none;
    }

    .video-page {
      width: 100vw;
      height: 100vh;

      scroll-snap-align: start;

      display: flex;
      justify-content: center;
      align-items: center;

      background: black;
    }

    video {
      width: 100%;
      height: 100%;

      object-fit: contain;
    }
  </style>
</head>


<body>

  <div class="container">

    <!-- ======================== -->
    <!-- 動画① -->
    <!-- ======================== -->

    <section class="video-page">

      <video
        src="movie01.mp4"
        autoplay
        muted
        loop
        playsinline
        preload="auto">
      </video>

    </section>


    <!-- ======================== -->
    <!-- 動画② -->
    <!-- ======================== -->

    <section class="video-page">

      <video
        src="movie02.mp4"
        muted
        loop
        playsinline
        preload="auto">
      </video>

    </section>

  </div>


  <script>

    // ==========================================
    // 動画要素の取得
    // ==========================================
    const videos = document.querySelectorAll("video");

    // ==========================================
    // 音声ミュート解除（画面タップで音をONにする）
    // ==========================================
    let isAudioEnabled = false;

    window.addEventListener("click", () => {
      if (!isAudioEnabled) {
        videos.forEach(v => v.muted = false);
        isAudioEnabled = true;
        console.log("🔊 音声を有効化しました");
      }
    }, { once: true });

    // ==========================================
    // サーボを動かす（Firebaseへ合図を送信）
    // ==========================================
    const FIREBASE_URL = "https://servo-switch-default-rtdb.asia-southeast1.firebasedatabase.app/servo.json";

    function moveServo() {
      const now = Date.now();
      console.log("☁️ Firebaseへトリガー送信中...", now);

      fetch(FIREBASE_URL, {
        method: "PATCH",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          trigger: now
        })
      })
        .then(response => {
          if (!response.ok) throw new Error("HTTP " + response.status);
          return response.json();
        })
        .then(data => {
          console.log("✅ Firebase送信成功：", data);
        })
        .catch(error => {
          console.error("❌ Firebase送信失敗：", error);
        });
    }


    // ==========================================
    // 動画の表示・非表示を監視
    // ==========================================

    const observer = new IntersectionObserver(

      (entries) => {

        entries.forEach((entry) => {

          const video = entry.target;


          // ==============================
          // 動画が画面に入った
          // ==============================

          if (entry.isIntersecting) {

            video.currentTime = 0;

            video.play().catch((error) => {

              console.log(
                "動画の自動再生がブロックされました"
              );

            });


            // サーボを動かす
            moveServo();

          }


          // ==============================
          // 動画が画面から出た
          // ==============================

          else {

            video.pause();

            video.currentTime = 0;

          }

        });

      },


      {
        threshold: 0.7
      }

    );


    // ==========================================
    // 全動画を監視
    // ==========================================

    videos.forEach((video) => {

      observer.observe(video);

    });

  </script>

</body>

</html>
